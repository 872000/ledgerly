<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerly — Personal Finance Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Ledgerly</h1>
  <div class="month-nav">
    <button id="prevMonth" aria-label="Previous month">&larr;</button>
    <span id="monthLabel"></span>
    <button id="nextMonth" aria-label="Next month">&rarr;</button>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card income"><span class="label">Income</span><span class="value" id="incomeVal">$0</span></div>
    <div class="card expense"><span class="label">Expenses</span><span class="value" id="expenseVal">$0</span></div>
    <div class="card net"><span class="label">Net</span><span class="value" id="netVal">$0</span></div>
  </section>

  <section class="panel">
    <h2>Daily cash flow</h2>
    <canvas id="dailyChart" width="900" height="260"></canvas>
    <div class="legend"><span class="sw income-sw"></span>Income <span class="sw expense-sw"></span>Expenses</div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>Budgets</h2>
      <div id="budgets"></div>
    </div>
    <div class="panel">
      <h2>Add transaction</h2>
      <form id="txForm">
        <label>Date <input type="date" id="txDate" required></label>
        <label>Description <input type="text" id="txDesc" maxlength="300" required placeholder="e.g. Grocery run"></label>
        <label>Amount <input type="number" id="txAmount" step="0.01" required placeholder="-45.20 (expense) or 1200 (income)"></label>
        <label>Category <select id="txCategory"></select></label>
        <button type="submit">Add</button>
      </form>
      <h2 class="mt">Import CSV</h2>
      <p class="hint">Columns: date, description, amount, category. Header row optional.</p>
      <form id="csvForm">
        <input type="file" id="csvFile" accept=".csv" required>
        <button type="submit">Import</button>
      </form>
      <p id="csvMsg" class="hint"></p>
    </div>
  </section>

  <section class="panel">
    <h2>Transactions</h2>
    <table id="txTable">
      <thead><tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
